name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build jobs cannot change releases. Only the final, single writer can create a draft.
permissions:
  contents: read

concurrency:
  group: timepin-stable-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Validate release configuration
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.config.outputs.version }}
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release contract tests
        run: python -I scripts/test_release.py
      - name: Check main, versions and signing configuration before any build
        id: config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python -I scripts/release.py check --release --github-output "$GITHUB_OUTPUT"
      - name: Reject an existing release tag (never replace a published feed)
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.config.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`;
            for (const lookup of [
              () => github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` }),
              () => github.rest.repos.getReleaseByTag({ ...context.repo, tag }),
            ]) {
              try {
                await lookup();
                throw new Error(`${tag} already exists. Use a new release version; do not overwrite assets.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  build-tauri:
    name: Build signed bundles (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Inject the public key (not a private key) into release configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -I scripts/release.py check --release --override .release-updater.json
      # No tauri-action releaseId/tagName: parallel jobs must never mutate a release/latest.json.
      - name: Build signed Tauri installers and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config .release-updater.json
      - name: Stage exact expected bundles and signatures
        run: python -I scripts/release.py stage --bundle src-tauri/target/${{ matrix.target }}/release/bundle --platform ${{ matrix.platform }} --output .release-stage
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: .release-stage/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  draft-release:
    name: Verify all signatures, assemble feed and create draft
    needs: [preflight, build-tauri]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: .release-input
      - name: Verify every updater payload and generate one complete latest.json
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: python -I scripts/release.py assemble --inputs .release-input --output .release-ready
      - name: Preserve validated release candidate for manual review
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-v${{ needs.preflight.outputs.version }}
          path: .release-ready/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Create a new draft only after all platforms validate
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            // Repeat the existence guard after the potentially long build.
            for (const lookup of [
              () => github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` }),
              () => github.rest.repos.getReleaseByTag({ ...context.repo, tag }),
            ]) {
              try {
                await lookup();
                throw new Error(`${tag} now exists; refusing to overwrite it.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            // Re-guard after the potentially long build: refuse if the tag was pushed
            // (a published release), but allow replacing a stale draft this pipeline created.
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              throw new Error(`${tag} tag was pushed during the build; refusing to overwrite.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!existing.draft) throw new Error(`${tag} is already published; refusing to overwrite.`);
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: existing.id });
              core.info(`Deleted stale draft release ${existing.id} for ${tag}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `TimePin ${tag}`,
              body: 'INCOMPLETE DRAFT: asset upload in progress. Do not publish.',
              draft: true,
              prerelease: false,
            }));
            const directory = '.release-ready';
            const files = fs.readdirSync(directory).sort();
            for (const name of files) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(path.join(directory, name)),
              });
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100,
            });
            if (assets.length !== files.length || files.some(name => !assets.some(asset =>
                asset.name === name && asset.size === fs.statSync(path.join(directory, name)).size))) {
              throw new Error('Draft asset set is incomplete. Do not publish.');
            }
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              draft: true,
              body: `TimePin ${tag}\n\nAll four platforms and updater signatures verified.\n\nBefore manually publishing: review docs/releasing.md, smoke-test installers and an N-1 → N update, and keep latest.json with the complete asset set.\n\nSHA256SUMS is included for manual downloads. macOS/Windows OS code signing is separate from updater signing.`,
            });
            await core.summary.addHeading('Validated draft release')
              .addLink(`TimePin ${tag}`, release.html_url)
              .addRaw('\nDraft only. A maintainer must review and publish it; latest.json is not live yet.\n')
              .write();
